version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=velocity_ultra_secret_key_2026
      - DATABASE_URL=postgresql://velocity_user:velocity_pass@postgres:5432/velocity_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velocity_user
      POSTGRES_PASSWORD: velocity_pass
      POSTGRES_DB: velocity_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
