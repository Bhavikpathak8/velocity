<p class="text-on-surface-variant">Enter your credentials to access your account.</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs uppercase" for="email">Email Address</label>
<div class="relative">
<input aria-describedby="email-error" aria-invalid="true" class="w-full px-md py-sm bg-surface border border-error text-primary rounded focus:outline-none focus:ring-1 focus:ring-error transition-colors" id="email" name="email" placeholder="example@email.com" type="email" value="invalid-email"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-error">error</span>
</div>
<p class="mt-xs font-label-sm text-label-sm text-error normal-case tracking-normal" id="email-error">Please enter a valid email address</p>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-sm text-label-sm text-on-surface uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors underline" href="#">Forgot password?</a>
</div>
<input class="w-full px-md py-sm bg-surface border border-outline-variant text-primary rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full bg-secondary-container hover:bg-secondary text-on-secondary-container font-label-sm text-label-sm uppercase tracking-widest py-md rounded-lg transition-colors duration-200 active:scale-[0.98] shadow-[0_4px_20px_rgba(2,102,255,0.2)]" type="submit">
                        Sign In
                    </button>
</div>
</form>

<div class="h-px bg-surface-container-high flex-1"></div>
</div>
<div class="mt-lg grid grid-cols-2 gap-md">
<button class="flex items-center justify-center px-md py-sm border border-outline-variant rounded-lg hover:border-primary transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mr-sm text-xl" data-icon="login">login</span>
<span class="font-label-sm text-label-sm text-on-surface uppercase group-hover:text-primary">Google</span>
