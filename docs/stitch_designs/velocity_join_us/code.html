<script>
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 1;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
            if (password.match(/\d/)) strength += 1;
            if (password.match(/[^a-zA-Z\d]/)) strength += 1;

            const bars = [
                document.getElementById('bar-1'),
                document.getElementById('bar-2'),
                document.getElementById('bar-3'),
                document.getElementById('bar-4')
            ];
            
            const text = document.getElementById('strength-text');
            const colors = ['bg-error', 'bg-error', 'bg-[#eab308]', 'bg-[#22c55e]']; // Custom colors for strength indication
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            bars.forEach(bar => {
                bar.className = 'h-1 w-full bg-surface-variant rounded-full transition-colors duration-300';
            });

            if (password.length === 0) {
                text.textContent = 'Password strength';
                text.className = 'font-label-sm text-label-sm text-on-surface-variant text-right';
                return;
            }

            for (let i = 0; i < strength; i++) {
                bars[i].className = `h-1 w-full rounded-full transition-colors duration-300 ${colors[strength - 1]}`;
            }

            text.textContent = labels[Math.max(0, strength - 1)];
            
            // Apply text color based on strength
            if(strength <= 2) {
                text.className = 'font-label-sm text-label-sm text-error text-right';
            } else if (strength === 3) {
                 text.className = 'font-label-sm text-label-sm text-[#eab308] text-right';
            } else {
                 text.className = 'font-label-sm text-label-sm text-[#22c55e] text-right';
            }
        }
    </script>
