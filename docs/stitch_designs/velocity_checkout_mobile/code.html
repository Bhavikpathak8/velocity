<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VELOCITY - Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container": "#efeded",
                      "surface-container-highest": "#e3e2e2",
                      "on-primary-fixed": "#1b1b1b",
                      "secondary-fixed": "#dae1ff",
                      "on-secondary-fixed-variant": "#003fa4",
                      "on-secondary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "outline": "#7e7576",
                      "background": "#fbf9f9",
                      "outline-variant": "#cfc4c5",
                      "on-primary-container": "#848484",
                      "on-tertiary-fixed-variant": "#474747",
                      "tertiary-fixed-dim": "#c6c6c6",
                      "on-error-container": "#93000a",
                      "secondary-container": "#0266ff",
                      "inverse-on-surface": "#f2f0f0",
                      "primary-fixed": "#e2e2e2",
                      "surface": "#fbf9f9",
                      "on-tertiary-fixed": "#1b1b1b",
                      "inverse-surface": "#303031",
                      "primary-container": "#1b1b1b",
                      "on-surface-variant": "#4c4546",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#001849",
                      "surface-variant": "#e3e2e2",
                      "surface-bright": "#fbf9f9",
                      "secondary": "#0050cc",
                      "primary-fixed-dim": "#c6c6c6",
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "surface-dim": "#dbdad9",
                      "on-background": "#1b1c1c",
                      "on-primary-fixed-variant": "#474747",
                      "surface-container-low": "#f5f3f3",
                      "secondary-fixed-dim": "#b3c5ff",
                      "surface-tint": "#5e5e5e",
                      "on-secondary-container": "#f9f7ff",
                      "tertiary-container": "#1b1b1b",
                      "tertiary": "#000000",
                      "primary": "#000000",
                      "on-tertiary-container": "#848484",
                      "on-error": "#ffffff",
                      "on-surface": "#1b1c1c",
                      "inverse-primary": "#c6c6c6",
                      "tertiary-fixed": "#e2e2e2",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#e9e8e7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-max": "1280px",
                      "base": "4px",
                      "sm": "8px",
                      "md": "16px",
                      "lg": "24px",
                      "xl": "48px",
                      "gutter": "24px",
                      "xs": "4px",
                      "2xl": "80px"
              },
              "fontFamily": {
                      "display-2xl": ["Inter"],
                      "display-lg": ["Inter"],
                      "title-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "display-2xl": ["72px", {"lineHeight": "76px", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                      "display-lg": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "800"}],
                      "title-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .checkout-step {
            transition: all 0.3s ease-in-out;
            max-height: 1000px; /* arbitrary large height for open state */
            overflow: hidden;
        }
        .checkout-step.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
        }
        .input-minimal {
            @apply w-full bg-transparent border-b border-outline-variant focus:border-primary text-on-surface font-body-md py-sm outline-none transition-colors duration-200 placeholder-on-surface-variant;
        }
        .step-header {
            @apply flex items-center justify-between py-md cursor-pointer border-b border-outline-variant;
        }
        /* Mobile Specific adjustments */
        @media (min-width: 768px) {
            body {
                background-color: #f5f5f7; /* Just to show it's a mobile view embedded */
            }
            #mobile-container {
                max-width: 414px;
                margin: 0 auto;
                background-color: white;
                min-height: 100vh;
                position: relative;
                box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
<!-- Mobile Container -->
<div class="w-full min-h-screen flex flex-col relative bg-surface" id="mobile-container">
<!-- TopAppBar (Transactional - Minimal) -->
<header class="w-full flex justify-between items-center h-20 px-5 bg-surface border-b border-outline-variant">
<button aria-label="Back" class="text-primary hover:text-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg text-[24px] leading-none font-black tracking-tighter text-primary">VELOCITY</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow px-5 pt-lg pb-32">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-lg">Checkout</h2>
<!-- Accordion Flow -->
<div class="space-y-4">
<!-- Step 1: Shipping -->
<div class="checkout-section">
<div class="step-header" onclick="toggleStep('shipping')">
<div class="flex items-center gap-sm">
<span class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-sm text-label-sm">1</span>
<h3 class="font-title-md text-title-md text-on-surface">Shipping</h3>
</div>
<span class="material-symbols-outlined text-on-surface-variant" id="icon-shipping">expand_less</span>
</div>
<div class="checkout-step pt-md pb-lg" id="step-shipping">
<div class="space-y-md">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Email Address</label>
<input class="input-minimal" placeholder="jane@example.com" type="email" value="jane@example.com"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">First Name</label>
<input class="input-minimal" placeholder="Jane" type="text"/>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Last Name</label>
<input class="input-minimal" placeholder="Doe" type="text"/>
</div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Street Address</label>
<input class="input-minimal" placeholder="123 Velocity Way" type="text"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">City</label>
<input class="input-minimal" placeholder="New York" type="text"/>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">ZIP Code</label>
<input class="input-minimal" placeholder="10001" type="text"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm py-md rounded-DEFAULT mt-md uppercase tracking-wider" onclick="nextStep('delivery')">Continue to Delivery</button>
</div>
</div>
</div>
<!-- Step 2: Delivery -->
<div class="checkout-section">
<div class="step-header opacity-50" id="header-delivery" onclick="toggleStep('delivery')">
<div class="flex items-center gap-sm">
<span class="w-6 h-6 rounded-full border border-outline-variant text-on-surface flex items-center justify-center font-label-sm text-label-sm">2</span>
<h3 class="font-title-md text-title-md text-on-surface">Delivery</h3>
</div>
<span class="material-symbols-outlined text-on-surface-variant" id="icon-delivery">expand_more</span>
</div>
<div class="checkout-step collapsed pt-md pb-lg" id="step-delivery">
<div class="space-y-sm">
<label class="flex items-center justify-between p-md border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-md">
<input checked="" class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="delivery" type="radio"/>
<div>
<div class="font-body-md text-body-md font-semibold text-on-surface">Standard</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">3-5 Business Days</div>
</div>
</div>
<div class="font-body-md text-body-md text-on-surface">Free</div>
</label>
<label class="flex items-center justify-between p-md border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-md">
<input class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="delivery" type="radio"/>
<div>
<div class="font-body-md text-body-md font-semibold text-on-surface">Express</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">1-2 Business Days</div>
</div>
</div>
<div class="font-body-md text-body-md text-on-surface">$15.00</div>
</label>
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm py-md rounded-DEFAULT mt-md uppercase tracking-wider" onclick="nextStep('payment')">Continue to Payment</button>
</div>
</div>
</div>
<!-- Step 3: Payment -->
<div class="checkout-section">
<div class="step-header opacity-50" id="header-payment" onclick="toggleStep('payment')">
<div class="flex items-center gap-sm">
<span class="w-6 h-6 rounded-full border border-outline-variant text-on-surface flex items-center justify-center font-label-sm text-label-sm">3</span>
<h3 class="font-title-md text-title-md text-on-surface">Payment</h3>
</div>
<span class="material-symbols-outlined text-on-surface-variant" id="icon-payment">expand_more</span>
</div>
<div class="checkout-step collapsed pt-md pb-lg" id="step-payment">
<div class="space-y-md">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Card Number</label>
<div class="relative">
<input class="input-minimal pr-10" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant">credit_card</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Expiration Date</label>
<input class="input-minimal" placeholder="MM/YY" type="text"/>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">CVV</label>
<input class="input-minimal" placeholder="123" type="text"/>
</div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Name on Card</label>
<input class="input-minimal" placeholder="Jane Doe" type="text"/>
</div>
</div>
</div>
</div>
</div>
<!-- Order Summary Preview -->
<div class="mt-xl pt-lg border-t border-outline-variant">
<h3 class="font-title-md text-title-md text-on-surface mb-md">Summary</h3>
<div class="space-y-sm">
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>Subtotal</span>
<span>$299.00</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">
<span>Shipping</span>
<span>Free</span>
</div>
<div class="flex justify-between font-title-md text-title-md text-on-surface pt-sm border-t border-outline-variant">
<span>Total</span>
<span>$299.00</span>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed md:absolute bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md border-t border-outline-variant p-5 z-50">
<button class="w-full bg-secondary-container text-on-primary font-label-sm text-label-sm py-4 rounded-DEFAULT uppercase tracking-widest hover:bg-secondary transition-colors shadow-[0_4px_20px_rgba(2,102,255,0.3)]">
                Place Order
            </button>
</div>
</div>
<script>
        const steps = ['shipping', 'delivery', 'payment'];
        
        function toggleStep(stepId) {
            steps.forEach(step => {
                const el = document.getElementById(`step-${step}`);
                const icon = document.getElementById(`icon-${step}`);
                
                if (step === stepId) {
                    el.classList.remove('collapsed');
                    icon.textContent = 'expand_less';
                } else {
                    el.classList.add('collapsed');
                    icon.textContent = 'expand_more';
                }
            });
        }

        function nextStep(nextStepId) {
            // Visually unlock the header
            const header = document.getElementById(`header-${nextStepId}`);
            if(header) {
                header.classList.remove('opacity-50');
                const badge = header.querySelector('span:first-child');
                badge.classList.remove('border', 'border-outline-variant', 'text-on-surface');
                badge.classList.add('bg-primary', 'text-on-primary');
            }
            toggleStep(nextStepId);
        }
    </script>
</body></html>
