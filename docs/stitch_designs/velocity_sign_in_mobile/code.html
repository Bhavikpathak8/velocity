<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VELOCITY - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#dae1ff",
                        "surface-container-highest": "#e3e2e2",
                        "primary-container": "#1b1b1b",
                        "inverse-surface": "#303031",
                        "surface-variant": "#e3e2e2",
                        "surface-container": "#efeded",
                        "tertiary-container": "#1b1b1b",
                        "on-primary-fixed": "#1b1b1b",
                        "surface-tint": "#5e5e5e",
                        "error-container": "#ffdad6",
                        "outline-variant": "#cfc4c5",
                        "error": "#ba1a1a",
                        "outline": "#7e7576",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-secondary-container": "#f9f7ff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface": "#fbf9f9",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-surface-variant": "#4c4546",
                        "background": "#fbf9f9",
                        "tertiary-fixed": "#e2e2e2",
                        "surface-bright": "#fbf9f9",
                        "primary-fixed-dim": "#c6c6c6",
                        "surface-dim": "#dbdad9",
                        "on-primary-fixed-variant": "#474747",
                        "secondary-fixed-dim": "#b3c5ff",
                        "inverse-primary": "#c6c6c6",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary": "#0050cc",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary-fixed": "#001849",
                        "primary-fixed": "#e2e2e2",
                        "on-background": "#1b1c1c",
                        "primary": "#000000",
                        "on-tertiary-container": "#848484",
                        "on-secondary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-container-low": "#f5f3f3",
                        "on-secondary-fixed-variant": "#003fa4",
                        "on-primary-container": "#848484",
                        "inverse-on-surface": "#f2f0f0",
                        "secondary-container": "#0266ff",
                        "on-surface": "#1b1c1c",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "48px",
                        "xs": "4px",
                        "base": "4px",
                        "container-max": "1280px",
                        "lg": "24px",
                        "2xl": "80px",
                        "gutter": "24px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-2xl": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-2xl": ["72px", { "lineHeight": "76px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background h-full font-body-md antialiased overflow-x-hidden md:hidden">
<!-- Top App Bar (Simplified for Login) -->
<header class="flex justify-between items-center w-full px-5 h-20">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Optional: Small logo could go here, but prompt asks for simple layout -->
</header>
<!-- Main Content Canvas -->
<main class="flex flex-col px-5 pt-8 pb-12 min-h-[calc(100vh-80px)]">
<!-- Heading -->
<div class="mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tighter">Sign In</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Welcome back to Velocity.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-6 flex-grow">
<!-- Email Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 bg-surface px-4 py-3 rounded border border-outline-variant focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full h-12 bg-surface px-4 py-3 rounded border border-outline-variant focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-12 mt-4 bg-primary text-on-primary rounded-lg font-label-sm text-label-sm uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Social / Alternative Login -->
<div class="mt-12 flex flex-col items-center">
<div class="w-full flex items-center gap-4 mb-6">
<div class="h-[1px] flex-grow bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Or continue with</span>
<div class="h-[1px] flex-grow bg-surface-container-high"></div>
</div>
<div class="flex flex-col gap-4 w-full">
<!-- Apple -->
<button class="w-full h-12 bg-surface text-primary border border-outline-variant rounded-lg font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.25.68 2.92.68.66 0 1.76-.71 3.23-.62 1.25.07 2.37.56 3.12 1.48-2.67 1.49-2.22 5.16.48 6.13-.67 1.83-1.66 3.86-3.08 5.3zm-3.66-15.65c.61-1.47-.2-2.99-1.52-3.63-.57 1.58.42 3.03 1.52 3.63z"></path>
</svg>
                    Apple
                </button>
<!-- Google -->
<button class="w-full h-12 bg-surface text-primary border border-outline-variant rounded-lg font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
<p class="mt-8 font-label-sm text-label-sm text-on-surface-variant text-center">
                Don't have an account? <a class="text-primary hover:underline" href="#">Sign up</a>
</p>
</div>
</main>
</body></html>
