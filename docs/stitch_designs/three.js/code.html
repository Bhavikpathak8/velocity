  # VELOCITY Payment Integration (Stripe Express.js)

This document outlines the backend implementation for processing payments using Stripe, integrated with the existing VELOCITY order system.

## 1. Setup
```javascript
// npm install stripe
const stripe = require('stripe')(process.env.STRIPE_SECRET_KEY);
const pool = require('./db');
```

## 2. Create Payment Intent (`POST /api/checkout/create-intent`)
Issues a client secret to the frontend to securely collect payment details.

```javascript
async function createPaymentIntent(req, res) {
  const { order_id } = req.body;

  try {
    // 1. Fetch order total from DB
    const orderResult = await pool.query('SELECT total_amount FROM orders WHERE id = $1', [order_id]);
    const amount = Math.round(orderResult.rows[0].total_amount * 100); // Stripe uses cents

    // 2. Create Intent
    const paymentIntent = await stripe.paymentIntents.create({
      amount,
      currency: 'usd',
      metadata: { order_id },
      automatic_payment_methods: { enabled: true },
    });

    res.json({ clientSecret: paymentIntent.client_secret });
  } catch (err) {
    res.status(500).json({ error: err.message });
  }
}
```

## 3. Stripe Webhook (`POST /api/webhooks/stripe`)
Handles asynchronous payment success/failure to update order status.

```javascript
async function handleWebhook(req, res) {
  const sig = req.headers['stripe-signature'];
  let event;

  try {
    event = stripe.webhooks.constructEvent(req.body, sig, process.env.STRIPE_WEBHOOK_SECRET);
  } catch (err) {
    return res.status(400).send(`Webhook Error: ${err.message}`);
  }

  if (event.type === 'payment_intent.succeeded') {
    const paymentIntent = event.data.object;
    const orderId = paymentIntent.metadata.order_id;

    // Update order status to 'processing'
    await pool.query(
      "UPDATE orders SET status = 'processing', updated_at = CURRENT_TIMESTAMP WHERE id = $1",
      [orderId]
    );
  }

  res.json({ received: true });
}
```
