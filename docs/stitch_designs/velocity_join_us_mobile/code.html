<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-secondary selection:text-on-secondary overflow-x-hidden">
<!-- Top Navigation (Mobile Specific - Back Button) -->
<header class="w-full px-[20px] h-20 flex items-center justify-between z-50 bg-background border-b border-surface-container-highest md:hidden sticky top-0">
<button aria-label="Go Back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display-lg text-[24px] leading-none font-black tracking-tighter text-primary uppercase">VELOCITY</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-[20px] py-xl max-w-[480px] mx-auto w-full md:mt-2xl md:mb-2xl md:px-xl md:border md:border-surface-container-highest md:rounded-[16px] md:bg-surface md:shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
<div class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join VELOCITY for exclusive access and elite performance gear.</p>
</div>
<form class="flex flex-col gap-md w-full">
<!-- Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant" for="name">Full Name</label>
<div class="relative">
<input class="w-full h-12 px-sm py-sm border border-surface-container-highest bg-surface rounded-DEFAULT font-body-md text-primary placeholder-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="name" name="name" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 px-sm py-sm border border-surface-container-highest bg-surface rounded-DEFAULT font-body-md text-primary placeholder-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 px-sm py-sm border border-surface-container-highest bg-surface rounded-DEFAULT font-body-md text-primary placeholder-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" name="password" placeholder="Create a password" required="" type="password"/>
</div>
<p class="font-label-sm text-[10px] text-on-surface-variant mt-1">Must be at least 8 characters long.</p>
</div>
<!-- CTA Button -->
<button class="mt-sm w-full h-12 bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest rounded-[8px] flex items-center justify-center hover:bg-inverse-surface active:scale-[0.98] transition-all duration-200 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined ml-2 text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
            Already have an account? 
            <a class="text-primary font-title-md text-[16px] underline hover:text-secondary transition-colors duration-200" href="#">Sign In</a>
</div>
<div class="mt-xl text-center">
<p class="font-label-sm text-[10px] text-outline-variant uppercase">By creating an account, you agree to our <a class="underline" href="#">Terms</a> &amp; <a class="underline" href="#">Privacy</a></p>
</div>
