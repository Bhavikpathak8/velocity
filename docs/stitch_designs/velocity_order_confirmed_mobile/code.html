<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom animation for the checkmark */
        @keyframes scaleIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary selection:text-on-secondary">
<!-- Minimal Header (Nav Suppressed for Transactional Flow) -->
<header class="w-full flex justify-center items-center py-md bg-background border-b border-outline-variant sticky top-0 z-50">
<h1 class="font-title-md text-title-md text-on-surface uppercase tracking-widest">Success</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter w-full max-w-[480px] mx-auto space-y-xl">
<!-- Hero Status Section -->
<section class="flex flex-col items-center text-center space-y-md w-full animate-scale-in">
<!-- Electric Blue Checkmark -->
<div class="flex items-center justify-center w-24 h-24 rounded-full bg-secondary-fixed-dim/20 mb-sm">
<span class="material-symbols-outlined text-[64px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Headline -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                Thank you for your order!
            </h2>
<!-- Order Reference -->
<p class="font-body-md text-body-md text-on-surface-variant">
                Order <span class="text-on-surface font-semibold">#VL-94285</span>
</p>
<!-- Status Badge -->
<div class="inline-flex items-center gap-sm px-md py-sm rounded-full bg-surface-container text-on-surface mt-sm">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Processing</span>
</div>
</section>
<!-- Summary Card (Level 1 Elevation) -->
<section class="w-full bg-surface-container-lowest rounded-xl p-lg border border-outline-variant shadow-[0_4px_20px_rgba(0,0,0,0.05)] flex flex-col space-y-md">
<div class="flex items-center gap-sm pb-sm border-b border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant">receipt_long</span>
<h3 class="font-title-md text-title-md text-on-surface">Order Summary</h3>
</div>
<div class="flex justify-between items-center py-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Items</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">2</span>
</div>
<div class="flex justify-between items-center py-xs pt-md border-t border-outline-variant border-dashed">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Total</span>
<span class="font-body-lg text-body-lg text-on-surface font-bold">$329.40</span>
</div>
</section>
<!-- Action Area -->
<section class="w-full flex flex-col space-y-md pt-lg">
<!-- Primary Action (Electric Blue equivalent based on theme) -->
<button class="w-full bg-secondary text-on-secondary py-md px-lg rounded-lg font-label-sm text-label-sm uppercase tracking-widest flex justify-center items-center gap-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-sm">
                Track Order
                <span class="material-symbols-outlined text-[18px]">local_shipping</span>
</button>
<!-- Secondary Action (Outline) -->
<button class="w-full bg-transparent border border-outline text-on-surface py-md px-lg rounded-lg font-label-sm text-label-sm uppercase tracking-widest flex justify-center items-center gap-sm hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200">
                Back to Home
            </button>
</section>
</main>
